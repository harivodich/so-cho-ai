<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f6b4a"/>
      <stop offset="100%" stop-color="#0a4630"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background with smooth rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGradient)"/>
  
  <!-- Stylized Ledger Book & Market Spark -->
  <g filter="url(#shadow)" transform="translate(64, 64)">
    <!-- Book Back/Spine -->
    <rect x="32" y="32" width="320" height="320" rx="36" fill="#ffffff" fill-opacity="0.96"/>
    <rect x="32" y="32" width="48" height="320" rx="24" fill="#e2e8f0"/>
    
    <!-- Ledger Lines -->
    <rect x="108" y="96" width="180" height="16" rx="8" fill="#cbd5e1"/>
    <rect x="108" y="144" width="140" height="16" rx="8" fill="#cbd5e1"/>
    <rect x="108" y="192" width="190" height="16" rx="8" fill="#cbd5e1"/>
    
    <!-- AI Sparkle / Money Accent Badge -->
    <circle cx="280" cy="270" r="64" fill="url(#accentGradient)"/>
    <!-- Plus / Check / Sparkle Icon in badge -->
    <path d="M280 238 L285 260 L307 265 L285 270 L280 292 L275 270 L253 265 L275 260 Z" fill="#ffffff"/>
  </g>
</svg>
